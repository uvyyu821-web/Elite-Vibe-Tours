<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Creative — Architectural Surfaces</title>
  <meta name="description" content="De Creative — Premium wooden paneling, PVC products and interior design services.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #EBE8E3; /* Drafting paper */
      --ink: #0A0A0A; /* Architectural black */
      --accent: #D73A15; /* Industrial Rust */
      --muted: #666666;
      
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'Manrope', sans-serif;
      --font-tech: 'JetBrains Mono', monospace;
      
      --border-heavy: 2px solid var(--ink);
      --border-light: 1px solid rgba(10, 10, 10, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
    }

    /* Aggressive paper grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.45;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    ::selection { background: var(--accent); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
    ::-webkit-scrollbar { width: 8px; border-left: var(--border-heavy); }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--ink); }

    /* Typography */
    h1, h2, h3, .display { font-family: var(--font-display); line-height: 1; }
    .tech { font-family: var(--font-tech); text-transform: uppercase; letter-spacing: -0.02em; font-size: 0.75rem; }
    
    /* Layout Primitives */
    .grid-wrap { display: grid; border-bottom: var(--border-heavy); }
    .col-border { border-right: var(--border-heavy); }
    .p-md { padding: 2rem; }
    .p-lg { padding: 4rem; }
    
    /* Navigation - Brutalist structural header */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: var(--bg);
      border-bottom: var(--border-heavy);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
    }
    .logo {
      font-family: var(--font-display); font-weight: 700; font-size: 1.5rem;
      text-decoration: none; color: var(--ink);
      padding: 1rem 2rem; border-right: var(--border-heavy);
      text-transform: uppercase; letter-spacing: -0.02em;
    }
    .nav-links { display: flex; height: 100%; }
    .nav-link {
      font-family: var(--font-tech); font-size: 0.75rem;
      text-decoration: none; color: var(--ink);
      padding: 0 2rem; display: flex; align-items: center;
      border-right: var(--border-light);
      transition: background 0.2s, color 0.2s;
    }
    .nav-link:hover, .nav-link.active { background: var(--ink); color: var(--bg); }
    .nav-cta {
      font-family: var(--font-tech); font-size: 0.75rem; font-weight: 700;
      background: var(--accent); color: var(--bg);
      text-decoration: none; padding: 0 2rem;
      display: flex; align-items: center; height: 100%;
      transition: opacity 0.2s;
    }
    .nav-cta:hover { opacity: 0.8; }
    .menu-toggle { display: none; padding: 1.5rem; background: none; border: none; border-left: var(--border-heavy); cursor: pointer; }
    .menu-toggle span { display: block; width: 24px; height: 2px; background: var(--ink); margin-bottom: 4px; transition: 0.3s; }
    .mobile-menu {
      display: none; position: fixed; top: 58px; left: 0; width: 100%;
      background: var(--bg); border-bottom: var(--border-heavy); z-index: 40;
    }
    .mobile-menu.open { display: block; }
    .mobile-menu a {
      display: block; padding: 1.5rem; border-bottom: var(--border-light);
      font-family: var(--font-tech); text-decoration: none; color: var(--ink);
    }
    
    main { margin-top: 59px; min-height: 100vh; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 1rem 2rem; border: var(--border-heavy);
      font-family: var(--font-tech); font-size: 0.75rem; font-weight: 700;
      text-decoration: none; color: var(--ink); background: transparent;
      cursor: pointer; transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .btn:hover { background: var(--ink); color: var(--bg); }
    .btn-solid { background: var(--ink); color: var(--bg); }
    .btn-solid:hover { background: var(--accent); border-color: var(--accent); }

    /* Hero Section - Editorial Spread */
    .hero {
      display: grid; grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 59px);
      border-bottom: var(--border-heavy);
    }
    .hero-text-col {
      display: flex; flex-direction: column; justify-content: space-between;
      border-right: var(--border-heavy); padding: 4rem;
      position: relative;
    }
    .hero-meta { display: flex; justify-content: space-between; border-bottom: var(--border-heavy); padding-bottom: 1rem; margin-bottom: 4rem; }
    .hero h1 { font-size: clamp(4rem, 10vw, 8rem); font-style: italic; letter-spacing: -0.04em; margin-left: -0.05em; }
    .hero h1 span { display: block; font-style: normal; font-weight: 700; color: var(--accent); margin-top: -0.2em; }
    .hero-desc { font-size: 1.25rem; max-width: 400px; margin-top: 4rem; }
    .hero-visual { position: relative; overflow: hidden; background: var(--ink); }
    .hero-visual img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; filter: grayscale(20%) contrast(1.2); }
    .hero-visual .overlay-text {
      position: absolute; bottom: 2rem; left: 2rem; color: var(--bg);
      font-family: var(--font-tech); font-size: 0.75rem; mix-blend-mode: difference;
    }

    /* Grid Sections */
    .section-editorial { display: grid; grid-template-columns: 300px 1fr; border-bottom: var(--border-heavy); }
    .section-header-col { border-right: var(--border-heavy); padding: 4rem 2rem; display: flex; flex-direction: column; justify-content: space-between; }
    .section-content-col { padding: 0; }
    
    .discipline-grid { display: grid; grid-template-columns: repeat(3, 1fr); height: 100%; }
    .discipline-card { padding: 3rem; border-right: var(--border-heavy); display: flex; flex-direction: column; }
    .discipline-card:last-child { border-right: none; }
    .discipline-card .num { font-family: var(--font-tech); font-size: 2rem; color: var(--accent); margin-bottom: auto; }
    .discipline-card h3 { font-size: 2.5rem; margin: 2rem 0 1rem; }
    
    /* Feature Manifest (Catalog Preview) */
    .manifest-grid { display: grid; grid-template-columns: repeat(4, 1fr); }
    .manifest-item { border-right: var(--border-heavy); display: flex; flex-direction: column; }
    .manifest-item:last-child { border-right: none; }
    .manifest-item .img-box { aspect-ratio: 4/5; border-bottom: var(--border-heavy); overflow: hidden; position: relative; }
    .manifest-item .img-box img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: filter 0.5s, transform 0.5s; }
    .manifest-item:hover .img-box img { filter: grayscale(0%); transform: scale(1.05); }
    .manifest-item .info { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .manifest-item h3 { font-size: 1.5rem; margin-bottom: 1rem; }
    .manifest-item .price-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 1rem; }

    /* Statement Marquee / Banner */
    .statement { background: var(--ink); color: var(--bg); padding: 6rem 4rem; text-align: center; border-bottom: var(--border-heavy); }
    .statement h2 { font-size: clamp(3rem, 7vw, 6rem); line-height: 0.9; text-transform: uppercase; }
    .statement i { color: var(--accent); }

    /* Full Catalog Page */
    .catalog-header { padding: 6rem 4rem; border-bottom: var(--border-heavy); }
    .catalog-header h1 { font-size: clamp(4rem, 8vw, 7rem); }
    
    .filter-bar {
      display: grid; grid-template-columns: 1fr 300px; border-bottom: var(--border-heavy);
      position: sticky; top: 59px; background: var(--bg); z-index: 30;
    }
    .filters { display: flex; border-right: var(--border-heavy); }
    .filter-btn {
      padding: 1.5rem 2rem; background: none; border: none; border-right: var(--border-light);
      font-family: var(--font-tech); font-size: 0.75rem; cursor: pointer; transition: 0.2s;
    }
    .filter-btn.active, .filter-btn:hover { background: var(--ink); color: var(--bg); }
    .search-input { width: 100%; border: none; background: transparent; padding: 0 2rem; font-family: var(--font-tech); font-size: 0.875rem; color: var(--ink); outline: none; }
    .search-input::placeholder { color: var(--muted); }

    /* Inventory Rows (Brutalist Table) */
    .inventory-list { display: flex; flex-direction: column; }
    .inventory-row {
      display: grid; grid-template-columns: 80px 100px 3fr 1.5fr 1fr 150px;
      align-items: center; border-bottom: var(--border-light);
      transition: background 0.3s, color 0.3s;
      text-decoration: none; color: var(--ink);
    }
    .inventory-row:hover { background: var(--ink); color: var(--bg); border-bottom-color: var(--ink); }
    .inventory-row > div { padding: 1.5rem; border-right: var(--border-light); height: 100%; display: flex; align-items: center; }
    .inventory-row:hover > div { border-right-color: rgba(235, 232, 227, 0.2); }
    .inventory-row > div:last-child { border-right: none; justify-content: center; }
    .inv-thumb { width: 100%; aspect-ratio: 1; overflow: hidden; background: #000; }
    .inv-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
    .inventory-row:hover .inv-thumb img { opacity: 1; }
    .inv-title { font-family: var(--font-display); font-size: 2rem; font-weight: 600; line-height: 1.1; }
    
    .add-action {
      background: transparent; border: 1px solid currentColor; color: inherit;
      width: 100%; padding: 0.75rem; font-family: var(--font-tech); font-size: 0.75rem;
      cursor: pointer; transition: 0.2s;
    }
    .inventory-row:hover .add-action { border-color: var(--bg); }
    .add-action:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .add-action.added { background: var(--bg); color: var(--ink); }
    .inventory-row:hover .add-action.added { background: var(--bg); color: var(--ink); }

    /* Product Detail */
    .spec-grid { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 59px); }
    .spec-visual { border-right: var(--border-heavy); position: sticky; top: 59px; height: calc(100vh - 59px); overflow: hidden; padding: 2rem; background: #fff; }
    .spec-visual img { width: 100%; height: 100%; object-fit: contain; }
    .spec-data { padding: 4rem; display: flex; flex-direction: column; }
    .spec-data h1 { font-size: clamp(3rem, 6vw, 5rem); margin: 1rem 0 2rem; line-height: 0.9; }
    .spec-table { border-top: var(--border-heavy); margin-top: 3rem; }
    .spec-row { display: grid; grid-template-columns: 150px 1fr; border-bottom: var(--border-light); padding: 1.5rem 0; }
    .spec-price-block { margin-top: 4rem; padding: 3rem; border: var(--border-heavy); text-align: center; }

    /* About / Editorial Text */
    .article-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: var(--border-heavy); }
    .article-text { padding: 6rem 4rem; border-right: var(--border-heavy); }
    .article-text p { font-size: 1.25rem; margin-bottom: 2rem; max-width: 500px; }
    .pull-quote { font-family: var(--font-display); font-size: 3rem; font-style: italic; line-height: 1.1; margin: 4rem 0; color: var(--accent); border-left: 4px solid var(--accent); padding-left: 2rem; }
    .article-img { width: 100%; height: 100%; object-fit: cover; }

    /* Contact Form - Structural */
    .contact-container { display: grid; grid-template-columns: 1fr 1fr; min-height: 80vh; }
    .contact-info { padding: 6rem 4rem; border-right: var(--border-heavy); display: flex; flex-direction: column; justify-content: space-between; }
    .contact-info h1 { font-size: clamp(4rem, 8vw, 7rem); margin-bottom: 2rem; }
    .info-block { border-top: var(--border-heavy); padding-top: 2rem; margin-top: 2rem; }
    .contact-form-wrap { padding: 6rem 4rem; background: var(--ink); color: var(--bg); }
    .form-group { margin-bottom: 3rem; }
    .form-group label { display: block; font-family: var(--font-tech); font-size: 0.75rem; margin-bottom: 1rem; color: var(--muted); }
    .form-input { 
      width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(235, 232, 227, 0.3);
      padding: 1rem 0; font-family: var(--font-body); font-size: 1.25rem; color: var(--bg); outline: none;
      transition: border-color 0.3s;
    }
    .form-input:focus { border-bottom-color: var(--accent); }
    
    /* Command Bar (Cart) */
    .cmd-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 70;
      background: var(--bg); border-top: var(--border-heavy);
      display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cmd-bar.peek { transform: translateY(calc(100% - 60px)); }
    .cmd-bar.open { transform: translateY(0); box-shadow: 0 -20px 40px rgba(0,0,0,0.2); }
    .cmd-header {
      height: 60px; display: flex; justify-content: space-between; align-items: center;
      padding: 0 2rem; cursor: pointer; font-family: var(--font-tech); font-size: 0.875rem;
      background: var(--ink); color: var(--bg);
    }
    .cmd-header:hover { background: #000; }
    .cmd-content { max-height: 60vh; overflow-y: auto; padding: 2rem; display: grid; grid-template-columns: 2fr 1fr; gap: 4rem; }
    .cmd-list { border-top: var(--border-heavy); }
    .cmd-item { display: grid; grid-template-columns: 2fr 1fr auto; padding: 1.5rem 0; border-bottom: var(--border-light); align-items: center; }
    .cmd-item-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
    .cmd-controls { display: flex; align-items: center; gap: 1rem; font-family: var(--font-tech); }
    .cmd-controls button { background: none; border: var(--border-light); width: 30px; height: 30px; cursor: pointer; font-family: var(--font-tech); }
    .cmd-summary { background: rgba(10,10,10,0.03); padding: 2rem; border: var(--border-light); height: fit-content; }
    
    /* Footer */
    #footer { background: var(--ink); color: var(--bg); padding: 6rem 4rem 2rem; }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 4rem; border-bottom: 1px solid rgba(235, 232, 227, 0.2); padding-bottom: 4rem; margin-bottom: 2rem; }
    .footer-logo { font-family: var(--font-display); font-size: 3rem; margin-bottom: 1rem; }
    .footer-links a { display: block; color: var(--bg); text-decoration: none; font-family: var(--font-tech); font-size: 0.75rem; margin-bottom: 1rem; opacity: 0.7; transition: 0.2s; }
    .footer-links a:hover { opacity: 1; color: var(--accent); }

    /* Motion & Reveals */
    .clip-reveal {
      clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
      transform: translateY(20px);
      opacity: 0;
    }
    .clip-reveal.visible {
      animation: brutalReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes brutalReveal {
      0% { clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%); transform: translateY(20px); opacity: 0; }
      100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transform: translateY(0); opacity: 1; }
    }
    
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }

    /* Mobile Adaptations */
    @media (max-width: 1024px) {
      .hero, .section-editorial, .spec-grid, .article-grid, .contact-container, .cmd-content { grid-template-columns: 1fr; }
      .hero-text-col, .section-header-col, .discipline-card, .manifest-item, .article-text, .contact-info { border-right: none; border-bottom: var(--border-heavy); }
      .discipline-grid, .manifest-grid { grid-template-columns: 1fr 1fr; }
      .filter-bar { grid-template-columns: 1fr; }
      .filters { border-right: none; overflow-x: auto; }
      .search-input { padding: 1.5rem 2rem; border-top: var(--border-heavy); }
      .inventory-row { display: none; } /* Hide complex table on mobile */
      .mobile-catalog { display: block; }
    }
    @media (max-width: 768px) {
      .nav-links, .nav-cta { display: none; }
      .menu-toggle { display: block; }
      .discipline-grid, .manifest-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 4rem; }
      .p-lg { padding: 2rem; }
      .footer-grid { grid-template-columns: 1fr; gap: 2rem; }
    }
    
    .mobile-catalog { display: none; }
    @media (max-width: 1024px) {
      .mobile-catalog { display: block; }
      .mobile-inv-card { border-bottom: var(--border-heavy); padding: 2rem; display: grid; grid-template-columns: 80px 1fr; gap: 2rem; }
      .mobile-inv-card .thumb { aspect-ratio: 1; background: #000; }
      .mobile-inv-card .thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
      .mobile-inv-card h3 { font-family: var(--font-display); font-size: 1.75rem; margin-bottom: 0.5rem; }
    }
  </style>
</head>
<body>
  <nav id="navbar">
    <a href="#/" class="logo" data-link>De Creative</a>
    <div class="nav-links" id="navLinks">
      <a href="#/catalog" data-link class="nav-link">Specification Catalog</a>
      <a href="#/about" data-link class="nav-link">Studio Manifesto</a>
      <a href="#/projects" data-link class="nav-link">Index of Works</a>
      <a href="#/contact" data-link class="nav-link">Inquiries</a>
    </div>
    <a href="#/catalog" data-link class="nav-cta">VIEW INVENTORY</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
      <span></span><span></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="#/catalog" data-link>Specification Catalog</a>
    <a href="#/about" data-link>Studio Manifesto</a>
    <a href="#/projects" data-link>Index of Works</a>
    <a href="#/contact" data-link>Inquiries</a>
  </div>

  <main id="app"></main>

  <footer id="footer"></footer>
  <div id="commandBar" class="cmd-bar"></div>

  <script>
    const PRODUCTS = [

      { id:'wp-004', name:'Burmese Teak Groove', category:'Wood Paneling', price:4100, unit:'/ sq.ft', description:'Golden teak with deep vertical channeling. Naturally resistant to moisture.', specs:{ Material:'Burmese Teak', Thickness:'20mm', Finish:'Semi-Gloss', Rating:'Class A', Warranty:'20 Yrs' }, image:'https://media.base44.com/images/public/6a4791ee6f887f072913fd56/6a4791ee6f887f072913fd56/e587cd5f4_generated_7066ac66.png' },

    ];

    const CATEGORIES = ['All', 'Wood Paneling', 'PVC Products', 'Services'];
    const WA_NUMBER = '916006824595';

    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('deCreativeCart') || '[]'); } catch (e) {}

    function saveCart() { try { localStorage.setItem('deCreativeCart', JSON.stringify(cart)); } catch (e) {} }
    function isInCart(id) { return cart.some(i => i.id === id); }
    function addItem(product) { if (isInCart(product.id)) return; cart.push({ ...product, qty: 1 }); saveCart(); renderCommandBar(); updateAddButtons(); }
    function removeItem(id) { cart = cart.filter(i => i.id !== id); saveCart(); renderCommandBar(); updateAddButtons(); }
    function updateQty(id, qty) { if (qty < 1) return removeItem(id); cart = cart.map(i => i.id === id ? { ...i, qty } : i); saveCart(); renderCommandBar(); }
    function clearCart() { cart = []; saveCart(); renderCommandBar(); updateAddButtons(); }
    function cartTotal() { return cart.reduce((s, i) => s + i.price * i.qty, 0); }

    function sendToWhatsApp(name, phone) {
      const lines = cart.map(i => `[${i.id}] ${i.name} — ₹${i.price.toLocaleString('en-IN')} x ${i.qty}`).join('\n');
      const msg = `SPECIFICATION MANIFEST:\n\n${lines}\n\nEST. TOTAL: ₹${cartTotal().toLocaleString('en-IN')}\n\nCLIENT: ${name}\nCONTACT: ${phone}\n\nRequesting formal review and structural quote.`;
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function fmt(n) { return n.toLocaleString('en-IN'); }

    const routes = { '/': renderHome, '/catalog': renderCatalog, '/about': renderAbout, '/projects': renderProjects, '/contact': renderContact };

    function getRoute() {
      const hash = window.location.hash.replace('#', '') || '/';
      if (hash.startsWith('/product/')) return { page: 'product', id: hash.replace('/product/', '') };
      return { page: hash };
    }

    function navigate() {
      const route = getRoute();
      const app = document.getElementById('app');
      window.scrollTo(0, 0);
      if (route.page === 'product') renderProductDetail(route.id);
      else if (routes[route.page]) routes[route.page](app);
      else renderHome(app); // Fallback
      renderFooter();
      renderCommandBar();
      updateActiveNav();
      closeMobileMenu();
      setTimeout(triggerReveal, 50);
    }

    function updateActiveNav() {
      const route = getRoute();
      document.querySelectorAll('.nav-link').forEach(link => {
        const href = link.getAttribute('href').replace('#', '');
        link.classList.toggle('active', href === route.page || (route.page === 'product' && href === '/catalog'));
      });
    }

    let catalogState = { category: 'All', search: '' };

      });

      const mobileEl = document.getElementById('mobileCatalog');

        listEl.innerHTML = `

        `;
      }

      if (mobileEl) {
        mobileEl.innerHTML = filtered.map(p => `
          <div class="mobile-inv-card clip-reveal">

              </div>
            </div>

        `).join('');
      }
      updateAddButtons();
      triggerReveal();
    }

    function renderProductDetail(id) {

    function renderContact(app) {

                  <div class="tech" style="color:var(--muted); margin-bottom: 0.5rem;">COORDINATES</div>

    function renderFooter() {
      document.getElementById('footer').innerHTML = `
        <div class="footer-grid">
          <div>
            <div class="footer-logo"><i>De Creative</i></div>
            <p class="tech" style="max-width: 300px; opacity: 0.6;">Architectural surfaces engineered for spatial permanence. Designed in Srinagar.</p>

          <div class="footer-links">

            <a href="#/" data-link>PRIVACY DOCTRINE</a>

      `;
    }

    function renderCommandBar() {
      const el = document.getElementById('commandBar');
      if (cart.length === 0) { el.classList.remove('peek', 'open'); return; }
      
      const isOpen = el.classList.contains('open');
      
      el.innerHTML = `
        <div class="cmd-header" id="cmdHeader">
          <div>SPECIFICATION MANIFEST [ ${cart.length} ITEM${cart.length > 1 ? 'S' : ''} ]</div>
          <div style="display:flex; gap: 2rem; align-items:center;">
            <span>EST: ₹${fmt(cartTotal())}</span>
            <span style="color:var(--accent)">${isOpen ? 'CLOSE ▼' : 'REVIEW & TRANSMIT ▲'}</span>
          </div>
        </div>
        <div class="cmd-content">
          <div class="cmd-list">
            <div class="tech" style="padding-bottom: 1rem; border-bottom: var(--border-heavy); color:var(--muted);">INVENTORY SCHEDULE</div>
            ${cart.map(item => `
              <div class="cmd-item">
                <div>
                  <div class="tech" style="color:var(--muted); margin-bottom: 0.25rem;">${item.id.toUpperCase()}</div>
                  <div class="cmd-item-title">${item.name}</div>
                </div>
                <div class="cmd-controls">
                  <button data-qty="dec" data-id="${item.id}">-</button>
                  <span style="width: 20px; text-align:center;">${item.qty}</span>
                  <button data-qty="inc" data-id="${item.id}">+</button>
                </div>
                <div class="tech" style="text-align: right;">
                  <button data-remove="${item.id}" style="background:none; border:none; color:var(--accent); cursor:pointer; font-family:var(--font-tech); margin-bottom:0.5rem;">REMOVE</button><br>
                  ₹${fmt(item.price * item.qty)}
                </div>
              </div>
            `).join('')}
          </div>
          <div class="cmd-summary">
            <div class="tech" style="margin-bottom: 2rem; border-bottom: var(--border-heavy); padding-bottom: 1rem;">FINALIZATION</div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 2rem;">
              <span class="tech" style="color:var(--muted)">GROSS ESTIMATE</span>
              <span style="font-family: var(--font-display); font-size: 2.5rem; line-height: 1;">₹${fmt(cartTotal())}</span>
            </div>
            <input type="text" id="cmdName" class="form-input" style="border-color: var(--border-heavy); color: var(--ink); margin-bottom: 1rem;" placeholder="CLIENT NAME">
            <input type="tel" id="cmdPhone" class="form-input" style="border-color: var(--border-heavy); color: var(--ink); margin-bottom: 2rem;" placeholder="CONTACT NUMBER">
            <button class="btn btn-solid" id="cmdSend" style="width: 100%; background: var(--accent); border-color: var(--accent);">TRANSMIT MANIFEST</button>
          </div>
        </div>
      `;
      
      el.classList.add('peek');
      
      document.getElementById('cmdHeader').onclick = () => {
        el.classList.toggle('open');
      };

      el.querySelectorAll('[data-qty]').forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const item = cart.find(i => i.id === id);
          if (btn.dataset.qty === 'inc') updateQty(id, item.qty + 1);
          else updateQty(id, item.qty - 1);
        };
      });
      
      el.querySelectorAll('[data-remove]').forEach(btn => {
        btn.onclick = e => { e.stopPropagation(); removeItem(btn.dataset.remove); };
      });
      
      document.getElementById('cmdSend').onclick = e => {
        e.stopPropagation();
        sendToWhatsApp(document.getElementById('cmdName').value || 'UNSPECIFIED', document.getElementById('cmdPhone').value || 'UNSPECIFIED');
      };
    }

    function updateAddButtons() {
      document.querySelectorAll('.add-action').forEach(btn => {
        const id = btn.dataset.id;
        const product = PRODUCTS.find(p => p.id === id);
        if (!product) return;
        btn.onclick = (e) => { 
          e.preventDefault(); e.stopPropagation(); 
          if (isInCart(id)) return; 
          addItem(product); 
        };
      });
    }

    function closeMobileMenu() {
      document.getElementById('mobileMenu').classList.remove('open');
    }

    function triggerReveal() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.clip-reveal').forEach(el => observer.observe(el));
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('mobileMenu').classList.toggle('open');
      });
      document.addEventListener('click', e => {
        const link = e.target.closest('[data-link]');
        if (link) {
          e.preventDefault();
          window.location.hash = link.getAttribute('href');
          closeMobileMenu();
        }
      });
      window.addEventListener('hashchange', navigate);
      navigate();
    });
  </script>
